services:
  ex-files-pg:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:?required}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?required}
      POSTGRES_DB: ${PG_DB:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ex-files-minio:
    image: minio/minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    networks: [internal]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  ex-files-backend:
    build: ./ex-files-backend
    restart: unless-stopped
    environment:
      DB_DSN: host=ex-files-pg user=${PG_USER} password=${PG_PASSWORD} dbname=${PG_DB} port=5432 sslmode=disable TimeZone=UTC
      JWT_SECRET: ${JWT_SECRET:?required}
      SEED_ROOT_EMAIL: ${SEED_ROOT_EMAIL:?required}
      SEED_ROOT_PASSWORD: ${SEED_ROOT_PASSWORD:?required}
      SEED_ROOT_NAME: ${SEED_ROOT_NAME:-Root}
      MINIO_ENDPOINT: ex-files-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: documents
      REDIS_ADDR: redis:6379
      CORS_ORIGINS: https://exfiles.spbware.xyz
      EMAIL_PROVIDER: smtp
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-ex-files <noreply@exfiles.spbware.xyz>}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317
      OTEL_SERVICE_NAME: ex-files-backend
    networks: [internal]
    depends_on:
      ex-files-pg:
        condition: service_healthy
      redis:
        condition: service_healthy
      ex-files-minio:
        condition: service_healthy

  ex-files-frontend:
    build: ./ex-files-frontend
    restart: unless-stopped
    environment:
      PORT: "3003"
      BACKEND_URL: http://ex-files-backend:8080
      ORIGIN: https://exfiles.spbware.xyz
      PUBLIC_MAX_UPLOAD_MB: ${PUBLIC_MAX_UPLOAD_MB:-25}
    networks: [internal, web]
    depends_on:
      - ex-files-backend

  loki:
    image: grafana/loki:3.4
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks: [internal]

  promtail:
    image: grafana/promtail:3.4
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/promtail/config.yml:/etc/promtail/config.yml:ro
      - ./ex-files-backend/tmp:/var/log/ex-files-backend:ro
    command: -config.file=/etc/promtail/config.yml
    networks: [internal]
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:2.7.0
    restart: unless-stopped
    user: "0:0"
    command: -config.file=/etc/tempo.yaml
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    networks: [internal]

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    # Localhost-only: reach it with `ssh -L 3200:127.0.0.1:3200 <vps>`.
    ports:
      - "127.0.0.1:3200:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [internal]
    depends_on:
      - loki
      - tempo

networks:
  web:
    external: true
  internal:
    driver: bridge

volumes:
  pgdata:
  miniodata:
  redisdata:
  loki-data:
  grafana-data:
  tempo-data:
