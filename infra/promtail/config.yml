server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Production / docker-compose-up path: scrape logs from the backend
  # container by its compose service label.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        regex: "ex-files-backend"
        action: "keep"
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            kind: kind
            event: event
            trace_id: trace_id
      - labels:
          level:
          kind:
          event:

  # Dev path: when the backend runs locally via `air`, its stdout is teed to
  # ex-files-backend/tmp/app.log (mounted into this container at
  # /var/log/ex-files-backend). This job tails that file so Loki sees the
  # same JSON logs the docker job would otherwise emit.
  - job_name: ex-files-backend-host
    static_configs:
      - targets: [localhost]
        labels:
          job: ex-files-backend
          service: ex-files-backend
          __path__: /var/log/ex-files-backend/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            kind: kind
            event: event
            trace_id: trace_id
      - labels:
          level:
          kind:
          event:
